[tox]
isolated_build = true
envlist = py313,py311,py312

[testenv]
allowlist_externals =
    poetry
    docker
    docker-compose
passenv =
    SSH_AUTH_SOCK
    SKIP
commands =
    poetry install -v
    poetry run pre-commit run --all-files
    poetry run pytest --junitxml=pytest-{envname}.xml tests/

[testenv:live]
description = Live integration tests against a real TAK server - LOCAL MACHINE ONLY, never in CI
commands =
    poetry install -v
    poetry run pytest live_tests/ -m live --no-cov
